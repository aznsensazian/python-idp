AWSTemplateFormatVersion: "2010-09-09"
Description: >
  REST API-driven SharePoint Document Library -> Structured JSON pipeline.
  Accepts POST /extract with SharePoint credentials and extraction instructions
  in the JSON body, downloads documents, extracts structured data using
  langextract, and writes JSON results to an S3 output bucket.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  ApiStageName:
    Type: String
    Default: v1
    Description: API Gateway deployment stage name.

  LangExtractApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Fallback API key for langextract (e.g. Gemini key).
      Can also be supplied per-request in the JSON payload.

  ExtractionInstructions:
    Type: String
    Default: "{}"
    Description: >
      Fallback JSON extraction instructions used when the request payload
      does not include extraction_instructions.

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing the packaged Lambda deployment zips.

  PollerCodeKey:
    Type: String
    Default: lambda/sharepoint_poller.zip
    Description: S3 key for the SharePoint poller Lambda zip.

  ProcessorCodeKey:
    Type: String
    Default: lambda/document_processor.zip
    Description: S3 key for the document processor Lambda zip.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ---- S3 Buckets ---------------------------------------------------------
  RawDocumentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-raw-${Environment}"
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawFiles
            Status: Enabled
            ExpirationInDays: 30
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: "raw/"
            Function: !GetAtt DocumentProcessorFunction.Arn

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-output-${Environment}"

  # ---- DynamoDB tracking table --------------------------------------------
  TrackingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-tracking-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # ---- SSM Parameters (fallback secrets) ----------------------------------
  SSMExtractionInstructions:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/${Environment}/extraction/instructions"
      Type: String
      Value: !Ref ExtractionInstructions

  SSMLangExtractApiKey:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/${Environment}/extraction/api_key"
      Type: String
      Value: !Ref LangExtractApiKey

  # ---- IAM Role -----------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:HeadObject
                Resource:
                  - !GetAtt RawDocumentBucket.Arn
                  - !Sub "${RawDocumentBucket.Arn}/*"
                  - !GetAtt OutputBucket.Arn
                  - !Sub "${OutputBucket.Arn}/*"
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource: !GetAtt TrackingTable.Arn
        - PolicyName: SSMAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/${Environment}/*"

  # ---- SharePoint Ingestion Lambda (API-driven) ---------------------------
  SharePointPollerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-sharepoint-ingestion-${Environment}"
      Runtime: python3.12
      Handler: sharepoint_poller.handler.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref PollerCodeKey
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          SSM_PARAMETER_PREFIX: !Sub "/${AWS::StackName}/${Environment}"
          RAW_BUCKET: !Ref RawDocumentBucket
          TRACKING_TABLE: !Ref TrackingTable
          LOG_LEVEL: INFO

  # ---- Document Processor Lambda ------------------------------------------
  DocumentProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-document-processor-${Environment}"
      Runtime: python3.12
      Handler: document_processor.handler.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref ProcessorCodeKey
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 600
      MemorySize: 1024
      Environment:
        Variables:
          SSM_PARAMETER_PREFIX: !Sub "/${AWS::StackName}/${Environment}"
          RAW_BUCKET: !Ref RawDocumentBucket
          OUTPUT_BUCKET: !Ref OutputBucket
          TRACKING_TABLE: !Ref TrackingTable
          LOG_LEVEL: INFO

  S3InvokeProcessorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DocumentProcessorFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt RawDocumentBucket.Arn

  # ---- API Gateway REST API -----------------------------------------------
  ExtractApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${AWS::StackName}-api-${Environment}"
      Description: REST API for triggering SharePoint document extraction.
      EndpointConfiguration:
        Types:
          - REGIONAL

  ExtractResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ExtractApi
      ParentId: !GetAtt ExtractApi.RootResourceId
      PathPart: extract

  ExtractMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExtractApi
      ResourceId: !Ref ExtractResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SharePointPollerFunction.Arn}/invocations"

  # API Gateway needs permission to invoke the Lambda.
  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SharePointPollerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExtractApi}/*"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ExtractMethod
    Properties:
      RestApiId: !Ref ExtractApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ExtractApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref ApiStageName
      MethodSettings:
        - ResourcePath: /extract
          HttpMethod: POST
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  ApiEndpoint:
    Description: URL of the POST /extract API endpoint.
    Value: !Sub "https://${ExtractApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/extract"

  RawBucketName:
    Description: S3 bucket holding raw documents downloaded from SharePoint.
    Value: !Ref RawDocumentBucket

  OutputBucketName:
    Description: S3 bucket where structured JSON output is written.
    Value: !Ref OutputBucket

  TrackingTableName:
    Description: DynamoDB table used for poll-state tracking.
    Value: !Ref TrackingTable

  SharePointIngestionArn:
    Description: ARN of the SharePoint ingestion Lambda.
    Value: !GetAtt SharePointPollerFunction.Arn

  DocumentProcessorArn:
    Description: ARN of the document processor Lambda.
    Value: !GetAtt DocumentProcessorFunction.Arn
